name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Không chạy trùng khi push liên tiếp
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # Test không bao giờ được chạm workspace thật
  PAOS_HOME: /tmp/paos-ci-workspace

jobs:
  # =========================================================================
  # Chất lượng mã — doc 17 §3
  # =========================================================================
  quality:
    name: Lint · Type · Architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Ruff format + lint
        run: |
          ruff format --check .
          ruff check .

      - name: mypy --strict (kernel/, sdk/)
        run: mypy

      - name: Quy tắc phụ thuộc (doc 17 §1)
        run: lint-imports --config .importlinter

  # =========================================================================
  # Bốn cổng không thể bỏ qua — doc 17 §2
  # Tách thành job riêng để khi đỏ, nhìn tên job là biết ranh giới nào bị phá.
  # =========================================================================
  gates:
    name: Cổng kiến trúc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # cổng 2 và 6 cần lịch sử git
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"

      - name: "Cổng 1 — Kernel sạch AI (P1 / MNT-01)"
        run: make gate1

      - name: "Cổng 2 — Kernel độc lập (MNT-06)"
        run: make gate2

      - name: "Cổng 3 — Agent mù provider (P3)"
        run: make gate3

      - name: "Cổng 4 — Không secret trong log (SEC-01)"
        run: make gate4

      - name: "Cổng 5 — Event schema đã đăng ký (P10)"
        run: make gate5

      - name: "Cổng 6 — Docs đồng bộ (MNT-09, cảnh báo)"
        run: make gate6 || true

  # =========================================================================
  # Test — kim tự tháp doc 08 §6.
  # Mọi thứ cần môi trường ngoài (Ollama, GPU) bị loại khỏi CI.
  # =========================================================================
  test:
    name: Unit · Contract · Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Kiểm SQLite của runner (doc 18 §2 E2)
        run: |
          python -c "import sqlite3; v=sqlite3.sqlite_version_info; \
            assert v >= (3,37), f'SQLite quá cũ: {v}'; print('sqlite', sqlite3.sqlite_version)"

      - name: Test + coverage Kernel (MNT-07 >= 85%)
        run: |
          pytest --cov --cov-report=term-missing --cov-report=xml \
            -m "not requires_ollama and not requires_gpu and not chaos"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  # =========================================================================
  # Chaos — doc 08 §7.4. Chậm, nên chỉ chạy trên main và khi gọi tay.
  # =========================================================================
  chaos:
    name: Chaos suite
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Chaos (kill -9, đầy đĩa, provider chết)
        run: pytest -m chaos -q

  # =========================================================================
  # Bài kiểm tra 10 năm — doc 02 §9. Mỗi quý, và khi gọi tay.
  # =========================================================================
  ten-year-test:
    name: Bài kiểm tra 10 năm
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Thay toàn bộ provider bằng stub
        run: make ten-year-test
