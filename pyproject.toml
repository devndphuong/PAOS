[project]
name = "paos"
version = "0.0.1"
description = "Personal AI Operating System — kernel, capability layer, agent runtime"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# Phụ thuộc runtime. Mỗi mục ở đây phải có ADR (doc 17 §7) và một phương án
# thay thế đã ghi lại (RSK-18). Ghim phiên bản tối thiểu, không dùng "latest".
dependencies = [
    "fastapi>=0.115",       # ADR-0021 — chỉ dùng trong apps/paosd/
    "uvicorn[standard]>=0.32",  # ADR-0021
    "pydantic>=2.9",        # ADR-0022 — model nội bộ, KHÔNG phải hợp đồng
    "jsonschema>=4.23",     # ADR-0022 — validate hợp đồng Event/Capability
    "python-ulid>=3.0",     # ADR-0023 — thay thế: tự cài đặt ~40 dòng
    "aiosqlite>=0.20",      # ADR-0024 — driver cho single-writer actor
    "pyyaml>=6.0",          # manifest, policy
    "httpx>=0.27",          # chỉ dùng trong providers/, KHÔNG trong kernel/
    "click>=8.1",           # ADR-0025 — thư viện CLI cho paosctl
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "import-linter>=2.1",
    "types-PyYAML",
    "types-jsonschema",
]

[project.scripts]
paosd = "apps.paosd.__main__:main"
paosctl = "apps.paosctl.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kernel", "sdk", "capabilities", "providers", "agents", "apps"]

# ---------------------------------------------------------------------------
# Lint & format — doc 17 §3
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
# docs/ chứa code mẫu minh họa (illustrative), không phải module thật — không
# bắt buộc format/lint như source code. Ruff format hỗ trợ format code-block
# trong markdown; loại trừ ở đây để tránh gate lint chạm vào nội dung tài liệu.
extend-exclude = ["docs/"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B",         # bugbear
    "ASYNC",     # lỗi async — quan trọng với ADR-0024
    "S",         # bandit (bảo mật)
    "T20",       # cấm print() — mọi thứ phải đi qua logger có trace_id
    "TRY",       # xử lý exception đúng cách (P8)
    "PL",        # pylint
    "RUF",
]
ignore = [
    "TRY003",    # cho phép message dài trong PaosError
    "PLR0913",   # nhiều tham số — chấp nhận ở tầng contract
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ASYNC240"]  # assert, magic number, Path I/O đồng bộ đều bình thường trong test
"apps/paosctl/**" = ["T20"]               # CLI được phép in ra stdout
"scripts/**" = ["T20"]                    # script CI độc lập, không có trace_id để log qua

[tool.ruff.lint.pylint]
max-args = 6
max-statements = 40                        # hỗ trợ MNT-08 (hàm < 60 dòng)

# ---------------------------------------------------------------------------
# Type checking — bắt buộc strict cho kernel/ và sdk/ (doc 17 §3)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["kernel", "sdk"]
warn_unreachable = true
disallow_any_explicit = false
show_error_codes = true

[[tool.mypy.overrides]]
module = ["ulid.*", "jsonschema.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Test — doc 08 §6-§7
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = "--strict-markers -q"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: test chạy lâu, loại khỏi vòng lặp phát triển",
    "requires_ollama: cần Ollama đang chạy — loại khỏi CI mặc định",
    "requires_gpu: cần GPU",
    "chaos: chaos test, chạy trước mỗi release",
    "contract: contract/conformance test — chạy mỗi PR",
]

# ---------------------------------------------------------------------------
# Coverage — MNT-07: Kernel >= 85%. Bật ngưỡng NGAY từ lát cắt 1, khi đạt
# 100% còn dễ. Bật muộn = không bao giờ bật.
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["kernel"]
branch = true
omit = ["*/migrations/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
